# GitLab CI pipeline for the STG Plugin Marketplace repository.
#
# EDMV3-T21. Scoped to the `edm` plugin only (`plugins/edm/**`) -- no other plugin in this
# repository has a build, test, or lint step, so a repository-wide gate would be a false
# positive on every unrelated MR. Jobs run on:
#   - merge requests whose changes touch plugins/edm/**
#   - every pipeline on the default branch (unconditionally), so the pipeline cannot rot
#     behind an unrelated merge and go stale without anyone noticing (SRD EDMV3-23).
#
# Image digest pinning (AC7). Every `image:` entry below is pinned to a `@sha256:` digest except
# the documented `bash:3.2` compatibility job, which is the one temporary floating-tag exception.
# The two digests currently pinned (`alpine:3.20`, `node:20-alpine`) were captured on 2026-07-24
# and MUST be refreshed against the live registry before this pipeline is first enabled against a
# real GitLab runner fleet -- pulling a tag and pinning by digest is an operational step that
# cannot be verified from a sandboxed development environment with no route to a container
# registry. Refresh procedure (run whenever these images are rotated):
#   docker pull <image>:<tag>
#   docker inspect --format='{{index .RepoDigests 0}}' <image>:<tag>
# then paste the resulting `<image>:<tag>@sha256:...` string into every `image:` line that uses
# it below.
#
# CA-161: package version pinning inside `before_script`. Every blocking job below installs
# `bash`/`jq`/`git`/`shellcheck` from the image's own Alpine package index at `apk add` time --
# on top of the image-digest pinning above, an unpinned `apk add` still lets a silently-rotated
# package (a new `shellcheck` or `jq` minor version) change what a lint job accepts, and the
# failure would present as "the code broke" rather than "the toolchain moved". Every
# `apk add --no-cache <pkg> ...` below is now pinned to an explicit `<pkg>=<version>-<rN>`
# captured from a live `docker run alpine:3.20 apk info -a <pkg>` (respectively `bash:3.2`'s own
# Alpine 3.22.5 base for `test:smoke-bash32`, which resolves its own independent package set)
# against this environment's registry access on 2026-08-06. This is a snapshot from this
# development environment, not a registry query the pinned runner fleet has necessarily made
# itself -- the same reproducibility caveat as the image-digest note above: an `apk add` for a
# version no longer present in the runner's configured mirror will fail loudly (a clear signal
# to re-pin) rather than silently drift, which is the property this fix is actually buying.
# Refresh procedure: `docker run --rm <image> sh -c "apk update >/dev/null 2>&1 && apk info -a
# <pkg>"` and paste the resulting `<pkg>-<version>-<rN>` (as `<pkg>=<version>-<rN>`) into every
# `apk add` line below that installs it.

stages:
  - lint
  - test
  - validate
  - eval

# ---- Shared rule set (AC2) ------------------------------------------------------------------
# Merge-request pipelines: only when the MR's changes touch plugins/edm/**.
# Any pipeline on the default branch: always, regardless of what changed, so a stale smoke
# assertion is caught even when the triggering merge touched an unrelated plugin.
.edm_rules: &edm_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - "plugins/edm/**/*"

# ---- Shared job template (EDMV3-T67 AC10) ----------------------------------------------------
# The pinned alpine image and the shared rule set are identical across every lint job -- eight of
# them today -- plus three non-lint jobs that need only bash/jq/git on Alpine (test:smoke,
# test:state-validate, validate:manifest); eleven consumers total (`grep -c '<<: \*alpine_edm'`
# over this file, pinned by a computed smoke-suite assertion so this sentence cannot silently
# drift again -- CA-460: lint:hooks-shell landed without this count, the job-graph note below,
# or CLAUDE.md's CI table being swept). Expressed once so a digest refresh (see the header note)
# stays a single-line change across all of them, not a stale count to keep in sync by hand.
.alpine_edm: &alpine_edm
  image: "alpine:3.20@sha256:4117b6e5b09d84c8f03ea45234ee7f8ec9f5c3a9792b80e3c9d54ded36d3735a"
  rules: *edm_rules

.node_edm: &node_edm
  image: "node:20-alpine@sha256:8a1761ffc4f153d49b3c6711271b962620a9cc77ffe7c693469a77907a136ea2"
  rules: *edm_rules

# ---- lint stage -------------------------------------------------------------------------------
#
# EDMV3-T67 AC10. The first four jobs below (lint:bash-syntax, lint:artifacts, lint:grants,
# lint:vocabulary) were previously four sequential script lines inside a single
# `lint:shell-and-artifacts` job. That had two costs: their wall-clock times summed, and because
# the block ran under `set -e`, the first failure suppressed the results of every check after it
# -- so a contributor fixing a syntax error learned about an artifact violation only on the next
# pipeline.
#
# Those four became four independent jobs, each carrying `needs: []`; the lint stage has since
# grown four more the same way (lint:shellcheck, lint:file-type-ban,
# lint:pattern-library-contract, lint:hooks-shell) -- eight lint jobs total today. An empty
# `needs` starts a job as soon as the pipeline begins instead of waiting for the stage ahead of
# it, so the runner fleet executes all eight concurrently and each reports its own pass/fail.
# Downstream jobs declare the specific lint jobs they depend on rather than waiting for the
# whole stage.

lint:bash-syntax:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0
  script:
    - |
      set -e
      echo "=== bash -n over plugins/edm/bin/ (including bin/tests/*.sh) and plugins/edm/evals/*.sh ==="
      # CA-019: plugins/edm/bin/edm-mermaid-rules.awk is a plain awk source file (loaded via
      # `awk -f`, never executed as a bash script and never sourced by bash), so it is excluded
      # from this bash-syntax sweep by extension the same way a future non-bash helper would be.
      # CA-162: plugins/edm/evals/*.sh (run-eval.sh, score-artifacts.sh, tiering-matrix.sh) were
      # previously uncovered by this sweep -- three executable bash scripts including the eval
      # driver that constructs a `claude` invocation with a permission posture.
      FAIL=0
      COUNT=0
      for f in plugins/edm/bin/* plugins/edm/bin/tests/*.sh plugins/edm/evals/*.sh; do
        [ -f "$f" ] || continue
        case "$f" in
          # G21/CA-233: *.txt is a data file (e.g. vocabulary-allowlist.txt,
          # vocabulary-prohibited.txt), never bash source; excluded the same way *.awk is.
          *.awk|*.txt) continue ;;
        esac
        COUNT=$((COUNT + 1))
        if bash -n "$f"; then
          echo "  OK: $f"
        else
          echo "  FAIL: bash -n $f"
          FAIL=1
        fi
      done
      if [ "$FAIL" -ne 0 ]; then
        echo "lint:bash-syntax: FAILED"
        exit 1
      fi
      echo "=== CA-005: the EDM-HELP sentinel-extractor awk literal may exist in exactly one file ==="
      dup_hits="$(grep -rl '/\^# EDM-HELP-BEGIN/{f=1;next} /\^# EDM-HELP-END/{f=0} f' plugins/edm/bin plugins/edm/evals 2>/dev/null | grep -v '^plugins/edm/bin/_edm-cli-lib\.sh$' | grep -v '/tests/' || true)"
      if [ -n "$dup_hits" ]; then
        echo "lint:bash-syntax: a second hand-copied EDM-HELP sentinel extractor was found (must source bin/_edm-cli-lib.sh's print_help instead):"
        printf '%s\n' "$dup_hits"
        echo "lint:bash-syntax: FAILED"
        exit 1
      fi
      echo "=== CA-005: no hardcoded sed -n 'A,Bp' \"\$0\" --help line-range extraction ==="
      range_hits="$(grep -rlE "sed[[:space:]]+-n[[:space:]]+'[0-9]+,[0-9]+p'[[:space:]]+\"\\\$0\"" plugins/edm/bin plugins/edm/evals 2>/dev/null | grep -v '/tests/' || true)"
      if [ -n "$range_hits" ]; then
        echo "lint:bash-syntax: a hardcoded --help line-range extraction was found (use the EDM-HELP sentinel form instead):"
        printf '%s\n' "$range_hits"
        echo "lint:bash-syntax: FAILED"
        exit 1
      fi
      echo "=== G11/CA-019: the Mermaid entity-walk literal may exist in exactly one file ==="
      # Bans a second hand-written copy of the strip_entities/mermaid_strip_entities character
      # walk (the "#NNN;" entity-code skip loop) outside the one canonical file this rule is
      # extracted into. G11 (round-3): bin/edm-lint-artifacts carried its own byte-equivalent
      # copy of this literal for three rounds after the shared file existed -- this grep is the
      # backstop so a fourth copy (here or anywhere else) fails the pipeline instead of drifting
      # silently.
      entity_hits="$(grep -rlE 'j <= n && substr\(s, j, 1\) ~ /\[0-9A-Za-z\]/' plugins/edm/bin plugins/edm/evals 2>/dev/null | grep -v '^plugins/edm/bin/edm-mermaid-rules\.awk$' | grep -v '/tests/' || true)"
      if [ -n "$entity_hits" ]; then
        echo "lint:bash-syntax: a second copy of the Mermaid entity-walk literal was found (must load bin/edm-mermaid-rules.awk via awk -f instead):"
        printf '%s\n' "$entity_hits"
        echo "lint:bash-syntax: FAILED"
        exit 1
      fi
      echo "lint:bash-syntax: OK -- ${COUNT} file(s) parsed"

lint:artifacts:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0 git=2.45.4-r0
  script:
    # `--all` enumerates initiatives via `edm-state list --paths` and dies if edm-state is not on
    # PATH, so bin/ must be exported the same way test:state-validate does it. This was latent in
    # the pre-split job too -- it never surfaced because this pipeline has not yet run against a
    # live runner (see the digest-pinning note in the header).
    - export PATH="$(pwd)/plugins/edm/bin:$PATH"
    - echo "=== edm-lint-artifacts --all (every tracked initiative, both layouts) ==="
    - |
      if bash plugins/edm/bin/edm-lint-artifacts --all; then
        echo "lint:artifacts: OK"
      else
        echo "lint:artifacts: FAILED"
        exit 1
      fi

lint:grants:
  stage: lint
  <<: *alpine_edm
  needs: []
  # jq is required, not optional: edm-check-grants dies with exit 2 when it is absent (it parses
  # hooks.json). The pre-split lint:shell-and-artifacts job installed it for all four checks at
  # once; keep it on every job that needs it now that they are separate.
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0
  script:
    - echo "=== edm-check-grants (four-source grant/instruction contract) ==="
    - |
      if bash plugins/edm/bin/edm-check-grants; then
        echo "lint:grants: OK -- grants and instruction surfaces consistent"
      else
        echo "lint:grants: FAILED"
        exit 1
      fi

lint:vocabulary:
  stage: lint
  <<: *alpine_edm
  needs: []
  # jq required -- edm-check-vocabulary dies with exit 2 without it (it validates the JSON scope
  # files). Same reason as lint:grants above.
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0
  script:
    - echo "=== edm-check-vocabulary (abolished-vocabulary and override-flag backstop, EDMV3-T30) ==="
    - |
      if bash plugins/edm/bin/edm-check-vocabulary; then
        echo "lint:vocabulary: OK -- vocabulary backstop clean"
      else
        echo "lint:vocabulary: FAILED"
        exit 1
      fi

# EDMV3-T61 AC8: pinned shellcheck job over the plugin's own bin/ scripts. The loop below
# unconditionally scans every file directly under plugins/edm/bin/* (not just new/modified
# code) -- pre-existing findings in code this initiative did not touch are still in scope for
# this pipeline; there is no changed-files filter. Scoped to the unquoted-expansion class of
# findings (SC2086/SC2046/SC2048/SC2068) rather than shellcheck's full default severity set:
# this codebase's existing header/usage comment blocks and intentionally-loose test fixtures
# trip many stylistic (non-safety) shellcheck findings that are out of scope for "no
# unquoted-expansion findings" specifically.
# CA-162: plugins/edm/bin/tests/*.sh and plugins/edm/evals/*.sh were previously uncovered by
# this loop entirely -- the same blind spot that let CA-014's mktemp template and CA-088's
# unescaped interpolation ship undetected in evals/. bin/tests/*.sh's deliberate
# space-separated-string-as-constant idiom (already used and disable-commented in bin/, see
# e.g. bin/edm-state, bin/edm-check-grants) was checked locally with the same
# --include set before landing this loop change and produced zero new SC2086/SC2046/SC2048/
# SC2068 hits, so no new disable comments were needed this round.
lint:shellcheck:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0 shellcheck=0.10.0-r1
  script:
    - |
      set -e
      echo "=== shellcheck (SC2086/SC2046/SC2048/SC2068 -- unquoted-expansion class) over plugins/edm/bin/, plugins/edm/bin/tests/*.sh and plugins/edm/evals/*.sh ==="
      FAIL=0
      COUNT=0
      for f in plugins/edm/bin/* plugins/edm/bin/tests/*.sh plugins/edm/evals/*.sh; do
        [ -f "$f" ] || continue
        case "$f" in
          # G24/CA-233 (round 5): *.awk added alongside *.txt -- edm-mermaid-rules.awk is plain
          # awk source (loaded via `awk -f`, never executed as bash), same reason lint:bash-syntax
          # above excludes it. *.txt is a data file (vocabulary-allowlist.txt,
          # vocabulary-prohibited.txt), never shellcheck-able bash source either.
          *.awk|*.txt) continue ;;
        esac
        COUNT=$((COUNT + 1))
        if shellcheck --shell=bash --include=SC2086,SC2046,SC2048,SC2068 "$f"; then
          echo "  OK: $f"
        else
          echo "  FAIL: shellcheck $f"
          FAIL=1
        fi
      done
      if [ "$FAIL" -ne 0 ]; then
        echo "lint:shellcheck: FAILED"
        exit 1
      fi
      echo "lint:shellcheck: OK -- ${COUNT} file(s) clean"

# CA-380: plugins/edm/hooks/hooks.json's nine command-type hooks are the only shell in the
# plugin that lint:bash-syntax and lint:shellcheck above never read -- both glob only
# plugins/edm/bin/*, plugins/edm/bin/tests/*.sh and plugins/edm/evals/*.sh, and hooks.json is
# in neither glob, despite the PreToolUse git-commit hook being the most privileged shell in
# the plugin (it runs automatically with no permission prompt on every commit). Extracts every
# command-type hook's `.command` string via jq and runs both checks over each, matching the
# finding's explicit "-s sh, not bash: the host picks the interpreter" -- shellcheck below runs
# `--shell=sh`, not `--shell=bash` as lint:shellcheck above does, because the host (not this
# plugin) chooses the interpreter that actually executes a hook command string. jq writes each
# extracted command straight to its own temp file rather than piping it into `bash -n <(cmd)`:
# process substitution needs bash itself as the invoking shell, which is not guaranteed for the
# runner's script stage (see the POSIX-sh-safe notes elsewhere in this file). The whole script
# body below is POSIX-sh-safe for that same reason -- no `read -d`, no `[[`, no arrays, no
# herestrings (CA-474). This job does not modify hooks.json -- it is pure CI-config addition,
# read-only against the file.
lint:hooks-shell:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0 shellcheck=0.10.0-r1
  script:
    - |
      set -e
      echo "=== bash -n + shellcheck --shell=sh (SC2086/SC2046/SC2048/SC2068) over every command-type hook in plugins/edm/hooks/hooks.json ==="
      FAIL=0
      COUNT=0
      TMP="$(mktemp -d)"
      trap 'rm -rf "$TMP"' EXIT
      # CA-437 + CA-474: indexed jq extraction, not a delimited read loop. CA-437's problem was
      # a .command string containing an embedded newline being split into N fragments that were
      # each syntax-checked independently (two individually well-formed halves of a malformed
      # command both pass bash -n), with COUNT silently over-reporting. Its NUL-delimited fix
      # relied on `read -d`, which is a bash extension with no POSIX equivalent. Measured, not
      # assumed: `dash` rejects it outright (`read: Illegal option -d`), while the BusyBox ash
      # in alpine:3.20 happens to accept it (its read option string is `d:n:bHm`). So the alpine
      # image is not itself the exposure -- the exposure is that this file does not choose the
      # script-stage interpreter at all. The runner does, before `apk add bash` in before_script
      # has installed anything, and on any dash-backed /bin/sh the failure is silent and
      # misdiagnosing: `read` rejects -d, the while condition is false immediately (errexit does
      # not apply to a loop condition), the body never runs, COUNT stays 0, and the cross-check
      # below fails this job while naming a splitting regression that did not happen.
      # Indexing by ordinal through jq needs no delimiter at all: jq writes each command to its
      # own file directly, so there is no shared stream for any loop to re-split, and CA-437's
      # embedded-newline case is handled by construction rather than by delimiter choice. The
      # loop bound IS jq's own command-hook total, which makes the cross-check below structural
      # rather than post-hoc.
      EXPECTED_COUNT="$(jq '[.hooks | to_entries[] | .value[] | .hooks[] | select(.type=="command")] | length' plugins/edm/hooks/hooks.json)"
      # EXPECTED_COUNT is now both the loop bound and the cross-check operand, so a non-numeric
      # value would mean zero iterations AND a `[` that errors out inside an `if` condition,
      # which errexit exempts -- i.e. a silent pass. Reject it up front instead.
      case "$EXPECTED_COUNT" in
        ''|*[!0-9]*)
          echo "lint:hooks-shell: FAILED -- jq returned a non-numeric command-hook count ('${EXPECTED_COUNT}') for plugins/edm/hooks/hooks.json"
          exit 1
          ;;
      esac
      # CA-518: EXPECTED_COUNT above only counts entries with type=="command"; it says nothing
      # about whether each one actually carries a usable command string. A hook whose .command
      # is null, an empty string, or a non-string would pass every check below (bash -n and
      # shellcheck both run against jq's `-r` rendering of it, which prints an empty file for a
      # null/absent value rather than erroring) while doing nothing at runtime. WELLFORMED is
      # the same select-chain narrowed to entries whose .command is a non-empty string, so a
      # divergence from EXPECTED_COUNT names a hook that is declared but not actually wired.
      WELLFORMED="$(jq '[.hooks | to_entries[] | .value[] | .hooks[] | select(.type=="command") | select(.command | type=="string" and length > 0)] | length' plugins/edm/hooks/hooks.json)"
      if [ "$WELLFORMED" != "$EXPECTED_COUNT" ]; then
        echo "lint:hooks-shell: FAILED -- ${WELLFORMED} of ${EXPECTED_COUNT} command-type hook(s) carry a non-empty string .command; the rest are null/empty/non-string and would silently no-op"
        exit 1
      fi
      IDX=0
      while [ "$IDX" -lt "$EXPECTED_COUNT" ]; do
        JQ_IDX="$IDX"
        IDX=$((IDX + 1))
        COUNT=$((COUNT + 1))
        cmdfile="${TMP}/hook-${IDX}.sh"
        jq -r --argjson n "$JQ_IDX" '[.hooks | to_entries[] | .value[] | .hooks[] | select(.type=="command")][$n].command' plugins/edm/hooks/hooks.json > "$cmdfile"
        if bash -n "$cmdfile" 2>"${TMP}/bashn-${IDX}.err"; then
          echo "  OK: bash -n hook #${IDX}"
        else
          echo "  FAIL: bash -n hook #${IDX}:"
          sed 's/^/    /' "${TMP}/bashn-${IDX}.err"
          FAIL=1
        fi
        if shellcheck --shell=sh --include=SC2086,SC2046,SC2048,SC2068 "$cmdfile"; then
          echo "  OK: shellcheck hook #${IDX}"
        else
          echo "  FAIL: shellcheck hook #${IDX}"
          FAIL=1
        fi
      done
      if [ "$COUNT" -ne "$EXPECTED_COUNT" ]; then
        echo "lint:hooks-shell: FAILED -- checked ${COUNT} command(s) but hooks.json declares ${EXPECTED_COUNT} (jq index/loop-bound mismatch, CA-437/CA-474)"
        exit 1
      fi
      if [ "$FAIL" -ne 0 ]; then
        echo "lint:hooks-shell: FAILED"
        exit 1
      fi
      echo "lint:hooks-shell: OK -- ${COUNT} command-type hook(s) clean"

# EDMV3-T57 AC10: this job blocks. EDMV3-80's file-type ban binds all six marketplace
# plugins; EDMV3-T57 relocated plugins/edm/'s two banned files (a .pptx and a .docx) out of
# the plugin directory and recorded a clean pre-merge scan across all six plugins (see the
# ticket's QC evidence), so the check no longer carries `allow_failure`. Scans git-tracked
# files only (never local, untracked OS artifacts like a developer's own uncommitted
# .DS_Store).
lint:file-type-ban:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0 git=2.45.4-r0
  script:
    - |
      set -e
      banned="$(git ls-files -- plugins | grep -iE '\.(pptx|docx)$|(^|/)\.DS_Store$' || true)"
      if [ -n "$banned" ]; then
        echo "file-type-ban: banned file(s) found under plugins/:"
        printf '%s\n' "$banned"
        echo "lint:file-type-ban: FAILED"
        exit 1
      fi
      echo "file-type-ban: clean -- no .pptx/.docx/.DS_Store tracked under plugins/"
      # EDMV3-T22 AC3 (shard-2 QC remediation): plugins/edm/evals/ has a documented 100KB
      # tracked-bytes budget (git-tracked files only; untracked eval output under
      # plugins/edm/evals/runs/ is excluded -- see plugins/edm/evals/fixtures/tiny-svc/README.md),
      # so growth there (a new fixture, a bloated baseline capture) is caught here rather than
      # silently landing. CA-463: an earlier revision of this comment called it a "directory-size
      # ceiling", which described a du-style measure this job has never performed and would send a
      # contributor reproducing it locally after an eval run far over budget.
      evals_bytes="$(
        git ls-files -- plugins/edm/evals \
          | while IFS= read -r f; do
              [ -f "$f" ] || continue
              wc -c < "$f"
            done \
          | awk '{s+=$1} END{print s+0}'
      )"
      evals_kb="$(( (evals_bytes + 1023) / 1024 ))"
      if [ "$evals_kb" -gt 100 ]; then
        echo "file-type-ban: tracked plugins/edm/evals/ content is ${evals_kb}KB, exceeds the documented 100KB budget:"
        git ls-files -- plugins/edm/evals \
          | while IFS= read -r f; do [ -f "$f" ] || continue; printf '  %8s  %s\n' "$(wc -c < "$f")" "$f"; done \
          | sort -rn
        echo "lint:file-type-ban: FAILED"
        exit 1
      fi
      echo "file-type-ban: tracked plugins/edm/evals/ size OK (${evals_kb}KB, documented budget is 100KB)"
      echo "file-type-ban: note -- eval runtime output under plugins/edm/evals/runs/ is retention-managed separately by CI artifacts and is not counted in this tracked-bytes budget"
      echo "lint:file-type-ban: OK -- no banned types, evals ${evals_kb}KB/100KB"

# EDMV3-T56: the Living-Library four-`##`-heading contract (docs/audit-patterns/README.md
# Sec."Living-Library Contract") as an enforced CI regression guard rather than a
# copy-pasteable snippet nobody runs. This is the authoritative version the README refers
# contributors to; the smoke-test aggregator's "EDMV3-T56" section (test:smoke below) is the
# test-stage twin that also exercises the negative cases (missing heading, fifth section,
# orphan append, an unexempted third file). Cheap and belongs in lint (not test), so it fails
# fast. No literal suite filename is named here (EDMV3-T21 AC5's no-wave-token guard).
lint:pattern-library-contract:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0
  script:
    - |
      set -e
      DOCS_DIR="plugins/edm/docs/audit-patterns"
      FAIL=0
      for f in "$DOCS_DIR"/*.md; do
        [ -f "$f" ] || continue
        base="$(basename "$f")"
        case "$base" in
          README.md) continue ;;   # README.md is exempt: the contract document itself
          SOURCES.md) continue ;;  # SOURCES.md is exempt: the provenance document (two headings)
        esac
        count="$(grep -c '^## ' "$f" || true)"
        if [ "${count:-0}" -ne 4 ]; then
          echo "CONTRACT-FAIL ${base}: expected exactly 4 '##' headings, found ${count:-0}"
          FAIL=1
          continue
        fi
        h1="$(grep '^## ' "$f" | sed -n '1p')"
        h2="$(grep '^## ' "$f" | sed -n '2p')"
        h3="$(grep '^## ' "$f" | sed -n '3p')"
        h4="$(grep '^## ' "$f" | sed -n '4p')"
        [ "$h1" = "## Top Recurring Findings" ] || { echo "CONTRACT-FAIL ${base}: heading 1 is '${h1}'"; FAIL=1; }
        [ "$h2" = "## Anti-Patterns" ] || { echo "CONTRACT-FAIL ${base}: heading 2 is '${h2}'"; FAIL=1; }
        [ "$h3" = "## Pre-Flight Checklist" ] || { echo "CONTRACT-FAIL ${base}: heading 3 is '${h3}'"; FAIL=1; }
        if ! printf '%s' "$h4" | grep -qE '^## What .*Looks Like$'; then
          echo "CONTRACT-FAIL ${base}: heading 4 is '${h4}', expected to match '^## What .*Looks Like\$'"
          FAIL=1
        fi
        orphan_count="$(awk '/^## What /{f=1} f' "$f" | grep -c '^### ' || true)"
        if [ "${orphan_count:-0}" -ne 0 ]; then
          echo "CONTRACT-FAIL ${base}: ${orphan_count} '###' heading(s) found under the 4th section (orphan append)"
          FAIL=1
        fi
      done
      doc_count="$(find "$DOCS_DIR" -maxdepth 1 -name '*.md' ! -name 'README.md' ! -name 'SOURCES.md' | wc -l | tr -d ' ')"
      if [ "$FAIL" -ne 0 ]; then
        echo "lint:pattern-library-contract: FAILED"
        exit 1
      fi
      echo "lint:pattern-library-contract: OK -- ${doc_count} library doc(s) pass the four-heading contract"

# ---- test stage -------------------------------------------------------------------------------

# AC5: this job's script is the aggregator invocation and nothing else. run-all.sh
# auto-discovers bin/tests/*-smoke.sh (EDMV3-T20 AC3) -- enumerating suite names here would be
# a second, silently-stale source of truth for the suite set.
test:smoke:
  stage: test
  <<: *alpine_edm
  # EDMV3-T67 AC10: depend on the syntax check specifically, not on the whole lint stage. A
  # `bash -n` failure means the suite cannot run meaningfully, so gate on it; the artifact,
  # grant and vocabulary checks are orthogonal to whether the suite passes and should not hold
  # it up.
  needs: ["lint:bash-syntax"]
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0 git=2.45.4-r0
  script:
    - |
      bash plugins/edm/bin/tests/run-all.sh || { echo "test:smoke: FAILED"; exit 1; }
    # EDMV3-T61 AC13 (amended, D19 in decisions.md): the help-completeness / bidirectional
    # dispatch-agreement contract-suite case runs in CI as part of run-all.sh's auto-discovered
    # suite set above -- run-all.sh's own per-suite output already names every discovered suite
    # (this job's log is the durable pointer to where it runs), so no individual suite is named
    # again here by its literal filename, which would be a second, silently-stale source of truth
    # for the suite set (the same drift AC5's comment on this job already warns against).

# EDMV3-T61 AC10: the same suite runs a second time under a pinned bash 3.2 image, not just the
# default (bash 5.x) runner bash used by test:smoke above -- this codebase targets bash 3.2
# (macOS's shipped default) as a hard constraint (EDMV3-91/106), and a grep for prohibited
# constructs (the contract-suite's "T61 AC9" case) proves the codebase never USES a bash-4-only
# construct, but only actually running the suite under bash 3.2 proves the constraint holds
# end-to-end.
#
# Documented exception (AC7, explicitly authorized -- EDMV3 wave-A QC remediation): every other
# image: line in this file is pinned to a `@sha256:...` digest (see the header note at the top of
# this file); `bash:3.2` below is the one exception. It is the official Docker Hub bash image's
# 3.2 tag, a floating tag, not yet digest-pinned -- same reason as the alpine/node placeholder
# digests the header note documents: no registry-connected environment was available to capture
# a real sha256 for it while implementing this ticket. This MUST be pinned to a `@sha256:...`
# digest, using the same refresh procedure the header note documents, before this job is first
# relied on against a live GitLab runner fleet.
test:smoke-bash32:
  stage: test
  image: "bash:3.2"
  rules: *edm_rules
  needs: ["lint:bash-syntax"]
  # CA-161: bash:3.2's own base (Alpine 3.22.5, confirmed live via `docker run bash:3.2 cat
  # /etc/os-release`) is a different Alpine minor than the alpine:3.20 pinned elsewhere in this
  # file, so it resolves its own, independently-pinned jq/git versions -- captured the same way
  # (`docker run bash:3.2 sh -c "apk update && apk info -a jq git"`) on 2026-08-06.
  before_script:
    - apk add --no-cache jq=1.8.1-r0 git=2.49.1-r0
  script:
    - bash --version
    # CA-006: assert we are actually running under bash 3.2 so a future image bump cannot
    # pass this job while proving nothing about the declared target shell.
    - |
      bash --version | head -1 | grep -q 'version 3\.2' || { echo "test:smoke-bash32: FAILED -- expected bash 3.2, got: $(bash --version | head -1)"; exit 1; }
    - |
      bash plugins/edm/bin/tests/run-all.sh || { echo "test:smoke-bash32: FAILED"; exit 1; }

# EDMV3-T61 AC12 (named exception taken): no macOS runner class is confirmed registered against
# this project's runner fleet -- unlike a Docker Hub image (test:smoke-bash32 above), a macOS
# runner is real hardware that must already be provisioned and tagged in the runner fleet; it
# cannot be created by editing this file, and a job with a `tags:` selector pointing at a
# non-existent runner class would sit "pending" forever rather than failing fast, which is worse
# than not adding it. The AC11 divergence points (sed -i, grep -P family, stat -c/-f, and the
# shasum/sha256sum choice in bin/tests/_harness.sh) are covered by targeted assertions instead
# (the contract-suite's "T61 AC11" case, _harness.sh's `_harness_hash_file`), and the gap itself
# is recorded in plugins/edm/CLAUDE.md's "macOS runner" note. Revisit once a macOS runner is
# confirmed available in this project's fleet.

# AC12 (Gate 3 revise): edm-state validate across every tracked, non-archived initiative,
# enumerated via the same layout-aware `edm-state list --paths` that edm-lint-artifacts --all
# uses (EDMV3-T20), so there is exactly one implementation of layout resolution. Informational
# anomalies are printed without failing the job; a blocking anomaly (edm-state validate exit 3)
# fails it, naming the initiative and the anomaly code.
test:state-validate:
  stage: test
  <<: *alpine_edm
  needs: ["lint:bash-syntax"]
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0 git=2.45.4-r0
  script:
    - |
      set -u
      # POSIX /bin/sh -safe on purpose (no process substitution, no arrays, no `read -d`): the
      # runner's shell-selection probe for this image runs before `apk add bash` in
      # before_script has installed anything, so the script stage itself may still execute under
      # plain sh. The `read` below uses only POSIX options; `read -d` is a bash extension that
      # dash rejects outright, and a rejected `read` in a loop condition zeroes the loop
      # silently rather than erroring (CA-474).
      export PATH="$(pwd)/plugins/edm/bin:$PATH"
      FAIL=0
      COUNT=0
      LIST_FILE="$(mktemp "${TMPDIR:-/tmp}/edm-state-validate.XXXXXX")"
      # CA-493: capture and check the enumerator's own exit status on the same statement, and
      # floor the checked count below -- without both, a broken EDM_SRD_ROOT, a relocated SRD/
      # tree, or a jq/layout regression in `list --paths` leaves LIST_FILE empty, the while loop
      # body never runs, COUNT stays 0, and this blocking job printed OK having validated nothing.
      LIST_EC=0
      edm-state list --paths > "$LIST_FILE" || LIST_EC=$?
      if [ "$LIST_EC" -ne 0 ]; then
        echo "test:state-validate: FAILED -- edm-state list --paths exited ${LIST_EC}"
        rm -f "$LIST_FILE"
        exit 1
      fi
      while IFS= read -r dir; do
        [ -n "$dir" ] || continue
        state_file="${dir}/.edm-state.json"
        [ -f "$state_file" ] || continue
        prefix="$(jq -r '.prefix // empty' "$state_file")"
        [ -n "$prefix" ] || { echo "SKIP: $state_file has no .prefix"; continue; }
        COUNT=$((COUNT + 1))
        echo "validate: ${prefix} (${dir})"
        ec=0
        out="$(edm-state validate "$prefix" 2>&1)" || ec=$?
        printf '%s\n' "$out"
        if [ "$ec" -eq 3 ]; then
          echo "  BLOCKING anomaly in ${prefix} (edm-state validate exit 3)"
          FAIL=1
        elif [ "$ec" -ne 0 ]; then
          echo "  edm-state validate exited ${ec} for ${prefix} (unexpected, treated as blocking)"
          FAIL=1
        fi
      done < "$LIST_FILE"
      rm -f "$LIST_FILE"
      echo "state-validate: ${COUNT} initiative(s) checked"
      # CA-493: a zero-count floor -- an enumerator that exits 0 but names no initiative directory
      # (a layout regression that returns an empty listing rather than a non-zero status) would
      # otherwise report OK having validated nothing, the same class CA-016 closed for run-all.sh.
      if [ "$COUNT" -eq 0 ]; then
        echo "test:state-validate: FAILED -- zero initiatives enumerated; the validator scanned nothing"
        exit 1
      fi
      if [ "$FAIL" -ne 0 ]; then
        echo "test:state-validate: FAILED (blocking anomaly present)"
        exit 1
      fi
      echo "test:state-validate: OK"

# ---- validate stage (two-tier, AC6) -------------------------------------------------------

# Tier 1: deterministic jq + shell manifest/frontmatter check. Needs only jq (plus the shell
# already present in every blocking-job image) -- no `claude` CLI dependency, so it is the one
# manifest check that survives a runner fleet that never has the CLI installed. Always blocks.
validate:manifest:
  stage: validate
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash=5.2.26-r0 jq=1.7.1-r0
  script:
    - |
      set -eu
      # POSIX /bin/sh -safe on purpose (no process substitution, no arrays, no herestrings, no
      # `read -d`): see the note on the test:state-validate job -- the runner may execute this
      # stage under plain sh regardless of the `apk add bash` in before_script.
      MANIFEST=".claude-plugin/marketplace.json"
      PLUGIN_DIR="plugins/edm"
      FAIL=0
      TMP="$(mktemp -d)"
      trap 'rm -rf "$TMP"' EXIT

      jq -e '.plugins[] | select(.name == "edm")' "$MANIFEST" > "${TMP}/edm_entry.json" \
        || { echo "validate:manifest: marketplace.json does not parse, or no plugin named 'edm' is declared"; echo "validate:manifest: FAILED"; exit 1; }

      jq -r '.skills[]?' "${TMP}/edm_entry.json" | sed 's#^\./skills/##' | sort > "${TMP}/declared_skills"
      : > "${TMP}/disk_skills"
      if [ -d "$PLUGIN_DIR/skills" ]; then
        for d in "$PLUGIN_DIR"/skills/*/; do
          [ -f "${d}SKILL.md" ] || continue
          basename "$d" >> "${TMP}/disk_skills"
        done
      fi
      sort -o "${TMP}/disk_skills" "${TMP}/disk_skills"
      comm -23 "${TMP}/declared_skills" "${TMP}/disk_skills" > "${TMP}/missing_skills" 2>/dev/null || true
      comm -13 "${TMP}/declared_skills" "${TMP}/disk_skills" > "${TMP}/undeclared_skills" 2>/dev/null || true
      if [ -s "${TMP}/missing_skills" ]; then
        echo "FAIL: skill(s) declared in marketplace.json but missing SKILL.md on disk:"; sed 's/^/  /' "${TMP}/missing_skills"; FAIL=1
      fi
      if [ -s "${TMP}/undeclared_skills" ]; then
        echo "FAIL: skill(s) on disk but not declared in marketplace.json:"; sed 's/^/  /' "${TMP}/undeclared_skills"; FAIL=1
      fi

      jq -r '.agents[]?' "${TMP}/edm_entry.json" | sed 's#^\./agents/##; s#\.md$##' | sort > "${TMP}/declared_agents"
      : > "${TMP}/disk_agents"
      if [ -d "$PLUGIN_DIR/agents" ]; then
        for f in "$PLUGIN_DIR"/agents/*.md; do
          [ -f "$f" ] || continue
          basename "$f" .md >> "${TMP}/disk_agents"
        done
      fi
      sort -o "${TMP}/disk_agents" "${TMP}/disk_agents"
      comm -23 "${TMP}/declared_agents" "${TMP}/disk_agents" > "${TMP}/missing_agents" 2>/dev/null || true
      comm -13 "${TMP}/declared_agents" "${TMP}/disk_agents" > "${TMP}/undeclared_agents" 2>/dev/null || true
      if [ -s "${TMP}/missing_agents" ]; then
        echo "FAIL: agent(s) declared in marketplace.json but missing on disk:"; sed 's/^/  /' "${TMP}/missing_agents"; FAIL=1
      fi
      if [ -s "${TMP}/undeclared_agents" ]; then
        echo "FAIL: agent(s) on disk but not declared in marketplace.json:"; sed 's/^/  /' "${TMP}/undeclared_agents"; FAIL=1
      fi

      TOOL_RE='^[A-Za-z][A-Za-z0-9]*(\([^)]*\))?$|^mcp__[A-Za-z0-9_{}]+__[A-Za-z0-9_{}]+$'

      check_frontmatter() {
        file="$1"
        line1="$(sed -n '1p' "$file")"
        if [ "$line1" != "---" ]; then
          echo "FAIL: $file: does not start with a frontmatter '---' delimiter"; FAIL=1; return
        fi
        close_line="$(awk 'NR>1 && $0=="---"{print NR; exit}' "$file")"
        if [ -z "$close_line" ]; then
          echo "FAIL: $file: frontmatter has no closing '---' delimiter"; FAIL=1; return
        fi
        sed -n "2,$((close_line-1))p" "$file" \
          | grep -vE '^[A-Za-z][A-Za-z0-9_-]*:.*$|^[[:space:]].*$|^[[:space:]]*$|^#.*$' > "${TMP}/bad_fm" || true
        if [ -s "${TMP}/bad_fm" ]; then
          echo "FAIL: $file: frontmatter block contains a line that is not a 'key: value' pair, a comment, or a continuation:"
          sed 's/^/  /' "${TMP}/bad_fm"; FAIL=1
        fi
        for field in allowed-tools tools disallowedTools; do
          toolline="$(sed -n "2,$((close_line-1))p" "$file" | grep -E "^${field}:" || true)"
          [ -n "$toolline" ] || continue
          printf '%s' "$toolline" | sed "s/^${field}: *//" | tr ',' '\n' > "${TMP}/tokens"
          while IFS= read -r tok; do
            tok="$(printf '%s' "$tok" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$tok" ] || continue
            if ! printf '%s' "$tok" | grep -qE "$TOOL_RE"; then
              echo "FAIL: $file: malformed tool name in $field: '$tok'"; FAIL=1
            fi
          done < "${TMP}/tokens"
        done
      }

      for f in "$PLUGIN_DIR"/skills/*/SKILL.md; do
        [ -f "$f" ] || continue
        check_frontmatter "$f"
      done
      for f in "$PLUGIN_DIR"/agents/*.md; do
        [ -f "$f" ] || continue
        check_frontmatter "$f"
      done

      if [ "$FAIL" -ne 0 ]; then
        echo "validate:manifest: FAILED"
        exit 1
      fi
      echo "validate:manifest: OK -- manifest and frontmatter consistent"

# Tier 2: runs `claude plugin validate` and compares its warning count against the committed
# baseline in .gitlab/edm-validate-baseline.txt. `allow_failure: true` unconditionally -- this
# is the one tier that is never blocking, whether it fails because a new warning was
# introduced or because the `claude` CLI image is unavailable on a given runner.
validate:plugin-cli:
  stage: validate
  <<: *node_edm
  needs: []
  allow_failure: true
  # G43/CA-319: pinned to an explicit version -- see the header note's CA-161 refresh procedure
  # (npm equivalent: `npm view @anthropic-ai/claude-code version`), same reproducibility caveat.
  # Install scripts are NOT disabled: `npm view @anthropic-ai/claude-code scripts` shows a
  # genuinely required `postinstall: node install.cjs` step that fetches the platform binary
  # (`bin/claude` is not a plain JS entry point) -- `--ignore-scripts` here would break the
  # install, not merely tighten it.
  before_script:
    - npm install -g @anthropic-ai/claude-code@2.1.226 || true
  script:
    - |
      set -u
      BASELINE_FILE=".gitlab/edm-validate-baseline.txt"
      if ! command -v claude >/dev/null 2>&1; then
        echo "validate:plugin-cli: 'claude' CLI not available in this image -- skipping tier 2"
        exit 0
      fi
      CLI_EC=0
      OUT="$(claude plugin validate plugins/edm/ 2>&1)" || CLI_EC=$?
      printf '%s\n' "$OUT"
      if [ "$CLI_EC" -ne 0 ]; then
        echo "validate:plugin-cli: FAILED -- claude plugin validate exited ${CLI_EC} (structural error)"
        exit 1
      fi
      COUNT="$(printf '%s\n' "$OUT" | grep -oE 'Found [0-9]+ warning' | grep -oE '[0-9]+' | head -1)"
      COUNT="${COUNT:-0}"
      BASELINE="$(cat "$BASELINE_FILE" 2>/dev/null || echo 0)"
      if [ "$COUNT" -gt "$BASELINE" ]; then
        echo "validate:plugin-cli: FAILED -- ${COUNT} warning(s) found, baseline is ${BASELINE} (new warning introduced)"
        exit 1
      fi
      echo "validate:plugin-cli: OK -- ${COUNT} warning(s) at or under baseline ${BASELINE}"

# ---- eval stage ---------------------------------------------------------------------------

# EDMV3-T22's headless driver (run-eval.sh) run against the tiny-svc fixture. Never blocking,
# never automatic on a normal MR pipeline -- `when: manual` there. A scheduled nightly pipeline
# (configured in GitLab CI/CD > Schedules with ANTHROPIC_API_KEY as a protected variable) runs
# it automatically. Absent ANTHROPIC_API_KEY the job is skipped outright (rules `when: never`),
# not failed -- a missing secret on a fork or contributor pipeline must not present as broken.
eval:nightly:
  stage: eval
  <<: *node_edm
  allow_failure: true
  # CA-444 (NOTED half): this outer job timeout must stay above the driver's own worst-case
  # inner budget, or the job is killed before run-eval.sh's cleanup trap can write run.json and
  # the stub scores.json and the partial-run handshake never fires. The arithmetic, recorded
  # here so raising either number is a deliberate decision rather than an accident:
  # 3 phases x EDM_EVAL_PHASE_TIMEOUT_SECONDS (2700s default) = 135m, plus the 60s auth probe
  # = 136m worst case inside the driver, leaving roughly 14m for the global npm install,
  # fixture provisioning, scoring and the baseline comparison. Adding a fourth phase, or
  # raising EDM_EVAL_PHASE_TIMEOUT_SECONDS, inverts the nesting -- raise this timeout in the
  # same change.
  timeout: 150m
  rules:
    - if: '$ANTHROPIC_API_KEY == null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "plugins/edm/**/*"
      when: manual
    - when: never
  # G43/CA-319: pinned (see validate:plugin-cli's identical note above for the version-pin
  # refresh procedure and why install scripts stay enabled). This is the one job in the
  # pipeline holding ANTHROPIC_API_KEY, so an unpinned, least-controlled install here was the
  # weakest link in the file, not merely a stylistic gap.
  before_script:
    - npm install -g @anthropic-ai/claude-code@2.1.226
  script:
    # CA-452: exit 4 (a partial run) does NOT abort here. run-eval.sh writes run.json and a stub
    # scores.json with complete:false on exit 4 *specifically so CI can see it* -- aborting on
    # any non-zero exit meant no CI path ever read that stub and the partial-run handshake was
    # dead wiring. A partial run continues through scoring and comparison, and edm-compare-eval
    # REFUSES a complete:false candidate by name, exit 2 (CA-490: this check now runs BEFORE the
    # baseline-existence check, so it fires even with no baseline committed yet -- D62/CA-106:
    # no baseline exists yet, but that no longer preempts this refusal the way it did before
    # CA-490's reorder). The job still fails at the end either way (CA-452's own final step).
    - |
      RUN_EVAL_EC=0
      bash plugins/edm/evals/run-eval.sh || RUN_EVAL_EC=$?
      if [ "$RUN_EVAL_EC" -ne 0 ] && [ "$RUN_EVAL_EC" -ne 4 ]; then
        echo "eval:nightly: FAILED -- run-eval.sh exited ${RUN_EVAL_EC}"; exit "$RUN_EVAL_EC"
      fi
      if [ "$RUN_EVAL_EC" -eq 4 ]; then
        echo "eval:nightly: PARTIAL run (exit 4) -- continuing so the stub scores.json's complete:false reaches the comparison (CA-452); the job fails after reporting"
      fi
      # CA-494: derive RUN_DIR exactly once, here, and reuse it in every later script block.
      # Scoring and comparison used to each re-run this same `ls -td` independently with no
      # else-arm, so a run-eval.sh that exited 0/4 without ever creating a runs/ directory --
      # exactly the kind of bug this job exists to catch -- silently skipped both stages instead
      # of failing. A plain shell var carries across script items because GitLab CI runs a
      # job's script list as one shell session, not one process per item.
      RUN_DIR="$(ls -td plugins/edm/evals/runs/*/ 2>/dev/null | head -1)"
      if [ -z "$RUN_DIR" ]; then
        echo "eval:nightly: FAILED -- run-eval.sh exited ${RUN_EVAL_EC} but created no directory under plugins/edm/evals/runs/"
        exit 1
      fi
      if [ ! -f "${RUN_DIR}run.json" ]; then
        echo "eval:nightly: FAILED -- ${RUN_DIR} exists but has no run.json"
        exit 1
      fi
    - |
      if [ -f plugins/edm/evals/score-artifacts.sh ]; then
        bash plugins/edm/evals/score-artifacts.sh "$RUN_DIR" || { echo "eval:nightly: FAILED -- score-artifacts.sh"; exit 1; }
      else
        echo "eval:nightly: FAILED -- plugins/edm/evals/score-artifacts.sh not found"
        exit 1
      fi
    # EDMV3-T39 AC2: the baseline comparison lives HERE, in CI, not in the scorer -- a scoring
    # change and a threshold change stay separately reviewable. baseline_total and the allowed
    # variance come from plugins/edm/evals/baseline/scores.json. Exit 3 means no committed
    # baseline exists yet (tripwire not armed); that is reported, not silently treated as a pass.
    - |
      if [ -f "${RUN_DIR}scores.json" ]; then
        rc=0
        bash plugins/edm/bin/edm-compare-eval "${RUN_DIR}scores.json" || rc=$?
        case "$rc" in
          0) echo "eval comparison: candidate at or above baseline_total minus variance" ;;
          3) echo "eval comparison: NOT ARMED -- no committed baseline (see evals/baseline/README.md)" ;;
          *) echo "eval:nightly: FAILED -- eval comparison failed with exit $rc"; exit "$rc" ;;
        esac
      else
        echo "eval:nightly: FAILED -- ${RUN_DIR}scores.json missing before comparison (score-artifacts.sh should have written it)"
        exit 1
      fi
    # CA-452: a partial run always fails the job, even if the comparison arm above was skipped
    # (e.g. no scores.json survived) or somehow reported clean -- partial is never green.
    - |
      if [ "${RUN_EVAL_EC:-0}" -eq 4 ]; then
        echo "eval:nightly: FAILED -- partial run (run-eval.sh exit 4); see run.json / stub scores.json in the artifacts"
        exit 4
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - plugins/edm/evals/runs/
