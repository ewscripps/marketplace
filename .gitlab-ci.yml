# GitLab CI pipeline for the STG Plugin Marketplace repository.
#
# EDMV3-T21. Scoped to the `edm` plugin only (`plugins/edm/**`) -- no other plugin in this
# repository has a build, test, or lint step, so a repository-wide gate would be a false
# positive on every unrelated MR. Jobs run on:
#   - merge requests whose changes touch plugins/edm/**
#   - every pipeline on the default branch (unconditionally), so the pipeline cannot rot
#     behind an unrelated merge and go stale without anyone noticing (SRD EDMV3-23).
#
# Image digest pinning (AC7). Every `image:` entry below is pinned to a `@sha256:` digest, not
# a floating tag. The two digests currently pinned (`alpine:3.20`, `node:20-alpine`) were
# captured on 2026-07-24 and MUST be refreshed against the live registry before this pipeline
# is first enabled against a real GitLab runner fleet -- pulling a tag and pinning by digest is
# an operational step that cannot be verified from a sandboxed development environment with no
# route to a container registry. Refresh procedure (run whenever these images are rotated):
#   docker pull <image>:<tag>
#   docker inspect --format='{{index .RepoDigests 0}}' <image>:<tag>
# then paste the resulting `<image>:<tag>@sha256:...` string into every `image:` line that uses
# it below.

stages:
  - lint
  - test
  - validate
  - eval

# ---- Shared rule set (AC2) ------------------------------------------------------------------
# Merge-request pipelines: only when the MR's changes touch plugins/edm/**.
# Any pipeline on the default branch: always, regardless of what changed, so a stale smoke
# assertion is caught even when the triggering merge touched an unrelated plugin.
.edm_rules: &edm_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - "plugins/edm/**/*"

# ---- Shared job template (EDMV3-T67 AC10) ----------------------------------------------------
# The pinned alpine image and the shared rule set are identical across every lint job. Expressed
# once so a digest refresh (see the header note) stays a single-line change even though the lint
# stage is now four jobs rather than one.
.alpine_edm: &alpine_edm
  image: "alpine:3.20@sha256:4117b6e5b09d84c8f03ea45234ee7f8ec9f5c3a9792b80e3c9d54ded36d3735a"
  rules: *edm_rules

# ---- lint stage -------------------------------------------------------------------------------
#
# EDMV3-T67 AC10. The four checks below were previously four sequential script lines inside a
# single `lint:shell-and-artifacts` job. That had two costs: their wall-clock times summed, and
# because the block ran under `set -e`, the first failure suppressed the results of every check
# after it -- so a contributor fixing a syntax error learned about an artifact violation only on
# the next pipeline.
#
# They are now four independent jobs, each carrying `needs: []`. An empty `needs` starts a job
# as soon as the pipeline begins instead of waiting for the stage ahead of it, so the runner
# fleet executes all four concurrently and each reports its own pass/fail. Downstream jobs
# declare the specific lint jobs they depend on rather than waiting for the whole stage.

lint:bash-syntax:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash
  script:
    - |
      set -e
      echo "=== bash -n over plugins/edm/bin/ (including bin/tests/*.sh) ==="
      FAIL=0
      for f in plugins/edm/bin/* plugins/edm/bin/tests/*.sh; do
        [ -f "$f" ] || continue
        if bash -n "$f"; then
          echo "  OK: $f"
        else
          echo "  FAIL: bash -n $f"
          FAIL=1
        fi
      done
      [ "$FAIL" -eq 0 ] || exit 1

lint:artifacts:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash jq git
  script:
    # `--all` enumerates initiatives via `edm-state list --paths` and dies if edm-state is not on
    # PATH, so bin/ must be exported the same way test:state-validate does it. This was latent in
    # the pre-split job too -- it never surfaced because this pipeline has not yet run against a
    # live runner (see the digest-pinning note in the header).
    - export PATH="$(pwd)/plugins/edm/bin:$PATH"
    - echo "=== edm-lint-artifacts --all (every tracked initiative, both layouts) ==="
    - bash plugins/edm/bin/edm-lint-artifacts --all

lint:grants:
  stage: lint
  <<: *alpine_edm
  needs: []
  # jq is required, not optional: edm-check-grants dies with exit 2 when it is absent (it parses
  # hooks.json). The pre-split lint:shell-and-artifacts job installed it for all four checks at
  # once; keep it on every job that needs it now that they are separate.
  before_script:
    - apk add --no-cache bash jq git
  script:
    - echo "=== edm-check-grants (four-source grant/instruction contract) ==="
    - bash plugins/edm/bin/edm-check-grants

lint:vocabulary:
  stage: lint
  <<: *alpine_edm
  needs: []
  # jq required -- edm-check-vocabulary dies with exit 2 without it (it validates the JSON scope
  # files). Same reason as lint:grants above.
  before_script:
    - apk add --no-cache bash jq git
  script:
    - echo "=== edm-check-vocabulary (abolished-vocabulary and override-flag backstop, EDMV3-T30) ==="
    - bash plugins/edm/bin/edm-check-vocabulary

# EDMV3-T61 AC8: pinned shellcheck job over the plugin's own bin/ scripts (new/modified code --
# pre-existing findings in code this initiative did not touch are out of scope per the ticket
# and get their own follow-up ticket rather than blocking this pipeline). Scoped to the
# unquoted-expansion class of findings (SC2086/SC2046/SC2048/SC2068) rather than shellcheck's
# full default severity set: this codebase's existing header/usage comment blocks and
# intentionally-loose test fixtures trip many stylistic (non-safety) shellcheck findings that
# are out of scope for "no unquoted-expansion findings in new code" specifically.
lint:shellcheck:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - |
      set -e
      echo "=== shellcheck (SC2086/SC2046/SC2048/SC2068 -- unquoted-expansion class) over plugins/edm/bin/ ==="
      FAIL=0
      for f in plugins/edm/bin/*; do
        [ -f "$f" ] || continue
        if shellcheck --shell=bash --include=SC2086,SC2046,SC2048,SC2068 "$f"; then
          echo "  OK: $f"
        else
          echo "  FAIL: shellcheck $f"
          FAIL=1
        fi
      done
      [ "$FAIL" -eq 0 ] || exit 1

# EDMV3-T57 AC10: this job blocks. EDMV3-80's file-type ban binds all six marketplace
# plugins; EDMV3-T57 relocated plugins/edm/'s two banned files (a .pptx and a .docx) out of
# the plugin directory and recorded a clean pre-merge scan across all six plugins (see the
# ticket's QC evidence), so the check no longer carries `allow_failure`. Scans git-tracked
# files only (never local, untracked OS artifacts like a developer's own uncommitted
# .DS_Store).
lint:file-type-ban:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash git
  script:
    - |
      set -e
      banned="$(git ls-files -- plugins | grep -iE '\.(pptx|docx)$|(^|/)\.DS_Store$' || true)"
      if [ -n "$banned" ]; then
        echo "file-type-ban: banned file(s) found under plugins/:"
        printf '%s\n' "$banned"
        exit 1
      fi
      echo "file-type-ban: clean -- no .pptx/.docx/.DS_Store tracked under plugins/"
      # EDMV3-T22 AC3 (shard-2 QC remediation): plugins/edm/evals/ has a documented 100KB
      # directory-size ceiling (plugins/edm/evals/fixtures/tiny-svc/README.md), so growth there
      # (a new fixture, a bloated baseline capture) is caught here rather than silently landing.
      evals_kb="$(du -sk plugins/edm/evals/ 2>/dev/null | awk '{print $1}')"
      evals_kb="${evals_kb:-0}"
      if [ "$evals_kb" -gt 100 ]; then
        echo "file-type-ban: plugins/edm/evals/ is ${evals_kb}KB, exceeds the documented 100KB budget:"
        exit 1
      fi
      echo "file-type-ban: plugins/edm/evals/ size OK (${evals_kb}KB, documented budget is 100KB)"

# EDMV3-T56: the Living-Library four-`##`-heading contract (docs/audit-patterns/README.md
# Sec."Living-Library Contract") as an enforced CI regression guard rather than a
# copy-pasteable snippet nobody runs. This is the authoritative version the README refers
# contributors to; the smoke-test aggregator's "EDMV3-T56" section (test:smoke below) is the
# test-stage twin that also exercises the negative cases (missing heading, fifth section,
# orphan append, an unexempted third file). Cheap and belongs in lint (not test), so it fails
# fast. No literal suite filename is named here (EDMV3-T21 AC5's no-wave-token guard).
lint:pattern-library-contract:
  stage: lint
  <<: *alpine_edm
  needs: []
  before_script:
    - apk add --no-cache bash
  script:
    - |
      set -e
      DOCS_DIR="plugins/edm/docs/audit-patterns"
      FAIL=0
      for f in "$DOCS_DIR"/*.md; do
        [ -f "$f" ] || continue
        base="$(basename "$f")"
        case "$base" in
          README.md) continue ;;   # README.md is exempt: the contract document itself
          SOURCES.md) continue ;;  # SOURCES.md is exempt: the provenance document (two headings)
        esac
        count="$(grep -c '^## ' "$f" || true)"
        if [ "${count:-0}" -ne 4 ]; then
          echo "CONTRACT-FAIL ${base}: expected exactly 4 '##' headings, found ${count:-0}"
          FAIL=1
          continue
        fi
        h1="$(grep '^## ' "$f" | sed -n '1p')"
        h2="$(grep '^## ' "$f" | sed -n '2p')"
        h3="$(grep '^## ' "$f" | sed -n '3p')"
        h4="$(grep '^## ' "$f" | sed -n '4p')"
        [ "$h1" = "## Top Recurring Findings" ] || { echo "CONTRACT-FAIL ${base}: heading 1 is '${h1}'"; FAIL=1; }
        [ "$h2" = "## Anti-Patterns" ] || { echo "CONTRACT-FAIL ${base}: heading 2 is '${h2}'"; FAIL=1; }
        [ "$h3" = "## Pre-Flight Checklist" ] || { echo "CONTRACT-FAIL ${base}: heading 3 is '${h3}'"; FAIL=1; }
        if ! printf '%s' "$h4" | grep -qE '^## What .*Looks Like$'; then
          echo "CONTRACT-FAIL ${base}: heading 4 is '${h4}', expected to match '^## What .*Looks Like\$'"
          FAIL=1
        fi
        orphan_count="$(awk '/^## What /{f=1} f' "$f" | grep -c '^### ' || true)"
        if [ "${orphan_count:-0}" -ne 0 ]; then
          echo "CONTRACT-FAIL ${base}: ${orphan_count} '###' heading(s) found under the 4th section (orphan append)"
          FAIL=1
        fi
      done
      if [ "$FAIL" -ne 0 ]; then
        echo "lint:pattern-library-contract: FAILED"
        exit 1
      fi
      echo "lint:pattern-library-contract: OK -- all five library docs pass the four-heading contract"

# ---- test stage -------------------------------------------------------------------------------

# AC5: this job's script is the aggregator invocation and nothing else. run-all.sh
# auto-discovers bin/tests/*-smoke.sh (EDMV3-T20 AC3) -- enumerating suite names here would be
# a second, silently-stale source of truth for the suite set.
test:smoke:
  stage: test
  <<: *alpine_edm
  # EDMV3-T67 AC10: depend on the syntax check specifically, not on the whole lint stage. A
  # `bash -n` failure means the suite cannot run meaningfully, so gate on it; the artifact,
  # grant and vocabulary checks are orthogonal to whether the suite passes and should not hold
  # it up.
  needs: ["lint:bash-syntax"]
  before_script:
    - apk add --no-cache bash jq git
  script:
    - bash plugins/edm/bin/tests/run-all.sh
    # EDMV3-T61 AC13 (amended, D19 in decisions.md): the help-completeness / bidirectional
    # dispatch-agreement contract-suite case runs in CI as part of run-all.sh's auto-discovered
    # suite set above -- run-all.sh's own per-suite output already names every discovered suite
    # (this job's log is the durable pointer to where it runs), so no individual suite is named
    # again here by its literal filename, which would be a second, silently-stale source of truth
    # for the suite set (the same drift AC5's comment on this job already warns against).

# EDMV3-T61 AC10: the same suite runs a second time under a pinned bash 3.2 image, not just the
# default (bash 5.x) runner bash used by test:smoke above -- this codebase targets bash 3.2
# (macOS's shipped default) as a hard constraint (EDMV3-91/106), and a grep for prohibited
# constructs (the contract-suite's "T61 AC9" case) proves the codebase never USES a bash-4-only
# construct, but only actually running the suite under bash 3.2 proves the constraint holds
# end-to-end.
#
# Documented exception (AC7, explicitly authorized -- EDMV3 wave-A QC remediation): every other
# image: line in this file is pinned to a `@sha256:...` digest (see the header note at the top of
# this file); `bash:3.2` below is the one exception. It is the official Docker Hub bash image's
# 3.2 tag, a floating tag, not yet digest-pinned -- same reason as the alpine/node placeholder
# digests the header note documents: no registry-connected environment was available to capture
# a real sha256 for it while implementing this ticket. This MUST be pinned to a `@sha256:...`
# digest, using the same refresh procedure the header note documents, before this job is first
# relied on against a live GitLab runner fleet.
test:smoke-bash32:
  stage: test
  image: "bash:3.2"
  rules: *edm_rules
  needs: ["lint:bash-syntax"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq git >/dev/null
  script:
    - bash --version
    - bash plugins/edm/bin/tests/run-all.sh

# EDMV3-T61 AC12 (named exception taken): no macOS runner class is confirmed registered against
# this project's runner fleet -- unlike a Docker Hub image (test:smoke-bash32 above), a macOS
# runner is real hardware that must already be provisioned and tagged in the runner fleet; it
# cannot be created by editing this file, and a job with a `tags:` selector pointing at a
# non-existent runner class would sit "pending" forever rather than failing fast, which is worse
# than not adding it. The AC11 divergence points (sed -i, grep -P family, stat -c/-f, and the
# shasum/sha256sum choice in bin/tests/_harness.sh) are covered by targeted assertions instead
# (the contract-suite's "T61 AC11" case, _harness.sh's `_harness_hash_file`), and the gap itself
# is recorded in plugins/edm/CLAUDE.md's "macOS runner" note. Revisit once a macOS runner is
# confirmed available in this project's fleet.

# AC12 (Gate 3 revise): edm-state validate across every tracked, non-archived initiative,
# enumerated via the same layout-aware `edm-state list --paths` that edm-lint-artifacts --all
# uses (EDMV3-T20), so there is exactly one implementation of layout resolution. Informational
# anomalies are printed without failing the job; a blocking anomaly (edm-state validate exit 3)
# fails it, naming the initiative and the anomaly code.
test:state-validate:
  stage: test
  <<: *alpine_edm
  needs: ["lint:bash-syntax"]
  before_script:
    - apk add --no-cache bash jq git
  script:
    - |
      set -u
      # POSIX /bin/sh -safe on purpose (no process substitution, no arrays): the runner's
      # shell-selection probe for this image runs before `apk add bash` in before_script has
      # installed anything, so the script stage itself may still execute under plain sh.
      export PATH="$(pwd)/plugins/edm/bin:$PATH"
      FAIL=0
      COUNT=0
      LIST_FILE="$(mktemp)"
      edm-state list --paths > "$LIST_FILE"
      while IFS= read -r dir; do
        [ -n "$dir" ] || continue
        state_file="${dir}/.edm-state.json"
        [ -f "$state_file" ] || continue
        prefix="$(jq -r '.prefix // empty' "$state_file")"
        [ -n "$prefix" ] || { echo "SKIP: $state_file has no .prefix"; continue; }
        COUNT=$((COUNT + 1))
        echo "validate: ${prefix} (${dir})"
        out="$(edm-state validate "$prefix" 2>&1)"
        ec=$?
        printf '%s\n' "$out"
        if [ "$ec" -eq 3 ]; then
          echo "  BLOCKING anomaly in ${prefix} (edm-state validate exit 3)"
          FAIL=1
        elif [ "$ec" -ne 0 ]; then
          echo "  edm-state validate exited ${ec} for ${prefix} (unexpected, treated as blocking)"
          FAIL=1
        fi
      done < "$LIST_FILE"
      rm -f "$LIST_FILE"
      echo "state-validate: ${COUNT} initiative(s) checked"
      if [ "$FAIL" -ne 0 ]; then
        echo "state-validate: FAILED (blocking anomaly present)"
        exit 1
      fi
      echo "state-validate: OK"

# ---- validate stage (two-tier, AC6) -------------------------------------------------------

# Tier 1: deterministic jq + shell manifest/frontmatter check. Needs only jq (plus the shell
# already present in every blocking-job image) -- no `claude` CLI dependency, so it is the one
# manifest check that survives a runner fleet that never has the CLI installed. Always blocks.
validate:manifest:
  stage: validate
  image: "alpine:3.20@sha256:4117b6e5b09d84c8f03ea45234ee7f8ec9f5c3a9792b80e3c9d54ded36d3735a"
  rules: *edm_rules
  before_script:
    - apk add --no-cache bash jq
  script:
    - |
      set -eu
      # POSIX /bin/sh -safe on purpose (no process substitution, no arrays, no herestrings):
      # see the note on the test:state-validate job -- the runner may execute this stage under
      # plain sh regardless of the `apk add bash` in before_script.
      MANIFEST=".claude-plugin/marketplace.json"
      PLUGIN_DIR="plugins/edm"
      FAIL=0
      TMP="$(mktemp -d)"
      trap 'rm -rf "$TMP"' EXIT

      jq -e '.plugins[] | select(.name == "edm")' "$MANIFEST" > "${TMP}/edm_entry.json" \
        || { echo "FAIL: marketplace.json does not parse, or no plugin named 'edm' is declared"; exit 1; }

      jq -r '.skills[]?' "${TMP}/edm_entry.json" | sed 's#^\./skills/##' | sort > "${TMP}/declared_skills"
      : > "${TMP}/disk_skills"
      if [ -d "$PLUGIN_DIR/skills" ]; then
        for d in "$PLUGIN_DIR"/skills/*/; do
          [ -f "${d}SKILL.md" ] || continue
          basename "$d" >> "${TMP}/disk_skills"
        done
      fi
      sort -o "${TMP}/disk_skills" "${TMP}/disk_skills"
      comm -23 "${TMP}/declared_skills" "${TMP}/disk_skills" > "${TMP}/missing_skills" 2>/dev/null || true
      comm -13 "${TMP}/declared_skills" "${TMP}/disk_skills" > "${TMP}/undeclared_skills" 2>/dev/null || true
      if [ -s "${TMP}/missing_skills" ]; then
        echo "FAIL: skill(s) declared in marketplace.json but missing SKILL.md on disk:"; sed 's/^/  /' "${TMP}/missing_skills"; FAIL=1
      fi
      if [ -s "${TMP}/undeclared_skills" ]; then
        echo "FAIL: skill(s) on disk but not declared in marketplace.json:"; sed 's/^/  /' "${TMP}/undeclared_skills"; FAIL=1
      fi

      jq -r '.agents[]?' "${TMP}/edm_entry.json" | sed 's#^\./agents/##; s#\.md$##' | sort > "${TMP}/declared_agents"
      : > "${TMP}/disk_agents"
      if [ -d "$PLUGIN_DIR/agents" ]; then
        for f in "$PLUGIN_DIR"/agents/*.md; do
          [ -f "$f" ] || continue
          basename "$f" .md >> "${TMP}/disk_agents"
        done
      fi
      sort -o "${TMP}/disk_agents" "${TMP}/disk_agents"
      comm -23 "${TMP}/declared_agents" "${TMP}/disk_agents" > "${TMP}/missing_agents" 2>/dev/null || true
      comm -13 "${TMP}/declared_agents" "${TMP}/disk_agents" > "${TMP}/undeclared_agents" 2>/dev/null || true
      if [ -s "${TMP}/missing_agents" ]; then
        echo "FAIL: agent(s) declared in marketplace.json but missing on disk:"; sed 's/^/  /' "${TMP}/missing_agents"; FAIL=1
      fi
      if [ -s "${TMP}/undeclared_agents" ]; then
        echo "FAIL: agent(s) on disk but not declared in marketplace.json:"; sed 's/^/  /' "${TMP}/undeclared_agents"; FAIL=1
      fi

      TOOL_RE='^[A-Za-z][A-Za-z0-9]*(\([^)]*\))?$|^mcp__[A-Za-z0-9_{}]+__[A-Za-z0-9_{}]+$'

      check_frontmatter() {
        file="$1"
        line1="$(sed -n '1p' "$file")"
        if [ "$line1" != "---" ]; then
          echo "FAIL: $file: does not start with a frontmatter '---' delimiter"; FAIL=1; return
        fi
        close_line="$(awk 'NR>1 && $0=="---"{print NR; exit}' "$file")"
        if [ -z "$close_line" ]; then
          echo "FAIL: $file: frontmatter has no closing '---' delimiter"; FAIL=1; return
        fi
        sed -n "2,$((close_line-1))p" "$file" \
          | grep -vE '^[A-Za-z][A-Za-z0-9_-]*:.*$|^[[:space:]].*$|^[[:space:]]*$|^#.*$' > "${TMP}/bad_fm" || true
        if [ -s "${TMP}/bad_fm" ]; then
          echo "FAIL: $file: frontmatter block contains a line that is not a 'key: value' pair, a comment, or a continuation:"
          sed 's/^/  /' "${TMP}/bad_fm"; FAIL=1
        fi
        for field in allowed-tools tools disallowedTools; do
          toolline="$(sed -n "2,$((close_line-1))p" "$file" | grep -E "^${field}:" || true)"
          [ -n "$toolline" ] || continue
          printf '%s' "$toolline" | sed "s/^${field}: *//" | tr ',' '\n' > "${TMP}/tokens"
          while IFS= read -r tok; do
            tok="$(printf '%s' "$tok" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$tok" ] || continue
            if ! printf '%s' "$tok" | grep -qE "$TOOL_RE"; then
              echo "FAIL: $file: malformed tool name in $field: '$tok'"; FAIL=1
            fi
          done < "${TMP}/tokens"
        done
      }

      for f in "$PLUGIN_DIR"/skills/*/SKILL.md; do
        [ -f "$f" ] || continue
        check_frontmatter "$f"
      done
      for f in "$PLUGIN_DIR"/agents/*.md; do
        [ -f "$f" ] || continue
        check_frontmatter "$f"
      done

      if [ "$FAIL" -ne 0 ]; then
        echo "validate:manifest: FAILED"
        exit 1
      fi
      echo "validate:manifest: OK -- manifest and frontmatter consistent"

# Tier 2: runs `claude plugin validate` and compares its warning count against the committed
# baseline in .gitlab/edm-validate-baseline.txt. `allow_failure: true` unconditionally -- this
# is the one tier that is never blocking, whether it fails because a new warning was
# introduced or because the `claude` CLI image is unavailable on a given runner.
validate:plugin-cli:
  stage: validate
  image: "node:20-alpine@sha256:8a1761ffc4f153d49b3c6711271b962620a9cc77ffe7c693469a77907a136ea2"
  rules: *edm_rules
  allow_failure: true
  before_script:
    - npm install -g @anthropic-ai/claude-code || true
  script:
    - |
      set -u
      BASELINE_FILE=".gitlab/edm-validate-baseline.txt"
      if ! command -v claude >/dev/null 2>&1; then
        echo "validate:plugin-cli: 'claude' CLI not available in this image -- skipping tier 2"
        exit 0
      fi
      OUT="$(claude plugin validate plugins/edm/ 2>&1)"
      CLI_EC=$?
      printf '%s\n' "$OUT"
      if [ "$CLI_EC" -ne 0 ]; then
        echo "validate:plugin-cli: FAIL -- claude plugin validate exited ${CLI_EC} (structural error)"
        exit 1
      fi
      COUNT="$(printf '%s\n' "$OUT" | grep -oE 'Found [0-9]+ warning' | grep -oE '[0-9]+' | head -1)"
      COUNT="${COUNT:-0}"
      BASELINE="$(cat "$BASELINE_FILE" 2>/dev/null || echo 0)"
      if [ "$COUNT" -gt "$BASELINE" ]; then
        echo "validate:plugin-cli: FAIL -- ${COUNT} warning(s) found, baseline is ${BASELINE} (new warning introduced)"
        exit 1
      fi
      echo "validate:plugin-cli: OK -- ${COUNT} warning(s) at or under baseline ${BASELINE}"

# ---- eval stage ---------------------------------------------------------------------------

# EDMV3-T22's headless driver (run-eval.sh) run against the tiny-svc fixture. Never blocking,
# never automatic on a normal MR pipeline -- `when: manual` there. A scheduled nightly pipeline
# (configured in GitLab CI/CD > Schedules with ANTHROPIC_API_KEY as a protected variable) runs
# it automatically. Absent ANTHROPIC_API_KEY the job is skipped outright (rules `when: never`),
# not failed -- a missing secret on a fork or contributor pipeline must not present as broken.
eval:nightly:
  stage: eval
  image: "node:20-alpine@sha256:8a1761ffc4f153d49b3c6711271b962620a9cc77ffe7c693469a77907a136ea2"
  allow_failure: true
  rules:
    - if: '$ANTHROPIC_API_KEY == null'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "plugins/edm/**/*"
      when: manual
    - when: never
  before_script:
    - npm install -g @anthropic-ai/claude-code
  script:
    - bash plugins/edm/evals/run-eval.sh
    - |
      if [ -f plugins/edm/evals/score-artifacts.sh ]; then
        RUN_DIR="$(ls -td plugins/edm/evals/runs/*/ 2>/dev/null | head -1)"
        if [ -n "$RUN_DIR" ]; then
          bash plugins/edm/evals/score-artifacts.sh "$RUN_DIR"
        fi
      fi
    # EDMV3-T39 AC2: the baseline comparison lives HERE, in CI, not in the scorer -- a scoring
    # change and a threshold change stay separately reviewable. baseline_total and the allowed
    # variance come from plugins/edm/evals/baseline/scores.json. Exit 3 means no committed
    # baseline exists yet (tripwire not armed); that is reported, not silently treated as a pass.
    - |
      RUN_DIR="$(ls -td plugins/edm/evals/runs/*/ 2>/dev/null | head -1)"
      if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/scores.json" ]; then
        bash plugins/edm/bin/edm-compare-eval "$RUN_DIR/scores.json"
        rc=$?
        case "$rc" in
          0) echo "eval comparison: candidate at or above baseline_total minus variance" ;;
          3) echo "eval comparison: NOT ARMED -- no committed baseline (see evals/baseline/README.md)" ;;
          *) echo "eval comparison: failed with exit $rc"; exit "$rc" ;;
        esac
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - plugins/edm/evals/runs/
